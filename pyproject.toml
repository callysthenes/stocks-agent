[project]
name = "stocks-agent"
version = "0.1.0"
description = "AI-powered stock analysis from Spanish YouTube investment channels"
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pymysql>=1.1.1",
    "cryptography>=43.0.3",
    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.1",
    "kombu>=5.4.0",
    # YouTube
    "yt-dlp>=2024.11.4",
    "youtube-transcript-api>=0.6.3",
    # Vector DB
    "chromadb>=0.5.23",
    # LlamaIndex (RAG)
    "llama-index-core>=0.12.0",
    "llama-index-vector-stores-chroma>=0.3.0",
    "llama-index-embeddings-huggingface>=0.4.0",
    "llama-index-llms-openai>=0.3.0",
    # LangChain + LangGraph
    "langchain>=0.3.7",
    "langchain-openai>=0.2.10",
    "langgraph>=0.2.55",
    "langchain-community>=0.3.7",
    # Financial data
    "yfinance>=0.2.50",
    "pandas-ta>=0.3.14b0",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    # Observability
    "langfuse>=2.0.0",
    # Delivery
    "python-telegram-bot>=21.7",
    # Dashboard
    "streamlit>=1.41.0",
    "plotly>=5.24.1",
    "altair>=5.5.0",
    # Utilities
    "httpx>=0.27.2",
    "aiofiles>=24.1.0",
    "loguru>=0.7.3",
    "tenacity>=9.0.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "ujson>=5.10.0",
]

[project.optional-dependencies]
# GPU-specific deps (installed in worker container)
gpu = [
    "faster-whisper>=1.1.0",
    "sentence-transformers>=3.3.1",
    # torch installed separately in Dockerfile.worker with CUDA index
]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.2",
    "ruff>=0.8.3",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]
